name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  simulation-and-publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Simulation invariants
        run: dotnet run --project Tests/SimulationChecks.csproj --configuration Release
      - name: Public source audit
        run: python Tools/check_publication.py
